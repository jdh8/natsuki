[project]
name = "natsuki-trainer"
version = "0.1.0"
description = "Reproducible training and evaluation tools for Natsuki's self-hosted model"
requires-python = ">=3.12,<3.13"
dependencies = [
    "TypeTreeGeneratorAPI==0.0.10",
    "UnityPy==1.25.3",
    "unrpa==2.3.0",
]

[dependency-groups]
# The M2 probe's training stack; heavy, so not part of the default install.
train = [
    "datasets>=3",
    "unsloth>=2025.8",
]

[tool.uv]
package = false
